name: Accessibility barrier
description: Report a barrier to using the project.
body:
- type: markdown
  attributes:
    value: Report for RFNM-SDRPP-SETUP. Do not include secrets or personal data. For vulnerabilities,
      follow https://github.com/chiaraberti13/RFNM-SDRPP-SETUP/security/policy.
- type: textarea
  id: barrier
  attributes:
    label: Task and barrier
    description: What were you trying to do and what prevented it? Do not include health information.
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps and expected result
    description: Identify the section and reproduction steps.
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Environment
    description: Project version, operating system, browser or terminal, zoom and assistive technology
      if used.
  validations:
    required: true
- type: textarea
  id: workaround
  attributes:
    label: Workaround and evidence
    description: Describe alternatives and attach anonymized examples only.
  validations:
    required: false
