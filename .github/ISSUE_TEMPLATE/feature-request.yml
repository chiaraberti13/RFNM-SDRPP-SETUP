name: Feature request
description: Propose a focused improvement.
body:
- type: markdown
  attributes:
    value: Report for RFNM-SDRPP-SETUP. Do not include secrets or personal data. For vulnerabilities,
      follow https://github.com/chiaraberti13/RFNM-SDRPP-SETUP/security/policy.
- type: textarea
  id: problem
  attributes:
    label: Problem or need
    description: Describe the task and current limitation.
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: Proposed solution
    description: Describe the desired result.
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: Alternatives
    description: List alternatives or workarounds considered.
  validations:
    required: false
- type: textarea
  id: impact
  attributes:
    label: Impact and verification
    description: Consider security, privacy, accessibility and a way to verify the result.
  validations:
    required: false
